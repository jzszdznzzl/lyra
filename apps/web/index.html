<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Lyra ships its own translations; browser translation rewrites the DOM and breaks React. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a0f" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Lyra</title>
    <!-- lyra:head -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Shown until the app renders (first visit, slow network, installing an update). Plain CSS:
         scripts cannot run before the bundle, and the page policy forbids inline ones. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0a0f;
      }
      .splash img {
        width: 72px;
        height: 72px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% {
          transform: scale(0.88);
          opacity: 0.6;
        }
      }
      @media (prefers-color-scheme: light) {
        .splash {
          background: #f7f3f5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <img src="/icons/favicon.svg" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
